[pytest]
# Run from research/kronos/.venv: python -m pytest research/kronos
#
# That environment has none of the live bot's packages, so the repo's root
# conftest -- which imports the trader to redirect its state files -- cannot
# load here, and need not: nothing in this folder touches live state. This
# file makes the folder the rootdir, which cuts conftest lookup at it.
addopts = -p no:cacheprovider
