# Type checking, added by audit finding F-1.
#
# Scoped deliberately. live_execution_backend.py is 2,065 lines that place
# every order this account makes and had no type checking at all; it gets the
# strict-ish treatment. The rest of the tree is checked loosely so the gate
# stays green and useful rather than being switched off on day one.
[mypy]
python_version = 3.13
warn_unused_configs = True
ignore_missing_imports = True
exclude = (^archive/|^test_|^conftest\.py$)

[mypy-live_execution_backend]
disallow_untyped_defs = True
warn_return_any = True
warn_unreachable = True
no_implicit_optional = True

[mypy-execution_backend]
disallow_untyped_defs = True

# The rebuilt execution + safety core. Strict: it places every order.
[mypy-core.*]
disallow_untyped_defs = True
warn_return_any = True
warn_unreachable = True
no_implicit_optional = True
