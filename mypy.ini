# Type checking, added by audit finding F-1.
#
# Scoped deliberately. core/ places every order this account makes and is
# checked strictly. The rest of the tree is checked loosely so the gate stays
# green and useful rather than being switched off on day one.
[mypy]
python_version = 3.13
warn_unused_configs = True
ignore_missing_imports = True
exclude = (^archive/|^test_|^conftest\.py$)

# The rebuilt execution + safety core. Strict: it places every order.
[mypy-core.*]
disallow_untyped_defs = True
warn_return_any = True
warn_unreachable = True
no_implicit_optional = True
